
name: Build NoticeNow Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract Android project
        run: |
          unzip -o ChangeRadarAndroid-GitHub-ready.zip
          cd ChangeRadarAndroid
          sed -i 's/android:label="ChangeRadar"/android:label="NoticeNow"/' app/src/main/AndroidManifest.xml

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        working-directory: ChangeRadarAndroid
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NoticeNow-debug-apk
          path: ChangeRadarAndroid/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
