
name: Build NoticeNow Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Check project files
        run: |
          ls -la
          find . -maxdepth 3 -type f | head -100

      - name: Extract project ZIP if present
        run: |
          if [ -f "ChangeRadarAndroid-GitHub-ready.zip" ]; then
            unzip -o "ChangeRadarAndroid-GitHub-ready.zip" -d extracted
          else
            echo "Project ZIP not found in repository root."
            exit 1
          fi

      - name: Locate Gradle project
        run: |
          find extracted -name gradlew -type f
          find extracted -name settings.gradle.kts -o -name settings.gradle

      - name: Build Android APK
        run: |
          cd extracted/ChangeRadarAndroid
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NoticeNow-debug-apk
          path: extracted/ChangeRadarAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
